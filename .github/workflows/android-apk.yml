name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'qml/**'
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK und NDK installieren
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;26.1.10909125'

      - name: Qt 6.8.2 für Android ARM64 installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true
          install-deps: true

      - name: Projekt konfigurieren
        shell: bash
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build-android \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/26.1.10909125"

      - name: APK bauen
        run: cmake --build build-android --target apk --parallel

      - name: APK einsammeln
        shell: bash
        run: |
          mkdir -p artifacts
          APK="$(find build-android -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo 'Keine APK gefunden.' >&2
            find build-android -maxdepth 8 -type f | sort
            exit 1
          fi
          cp "$APK" artifacts/XdrTablet-arm64-v8a-debug.apk
          ls -lh artifacts/XdrTablet-arm64-v8a-debug.apk

      - name: APK als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: XdrTablet-Android-arm64
          path: artifacts/XdrTablet-arm64-v8a-debug.apk
          if-no-files-found: error
