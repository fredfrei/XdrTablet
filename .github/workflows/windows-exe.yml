name: Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub-Release-Tag, z. B. v0.1.4"
        required: true
        default: "v0.1.4"

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-2022

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Qt 6.8.2 installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          modules: "qtserialport"
          cache: true
          install-deps: true

      - name: Projekt konfigurieren
        shell: pwsh
        run: |
          cmake -S . -B build-windows `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Projekt bauen
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --parallel

      - name: Windows-Paket erstellen
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build-windows -Recurse -Filter XdrTablet.exe |
            Where-Object { $_.FullName -match 'Release' } |
            Select-Object -First 1

          if (-not $exe) {
            $exe = Get-ChildItem -Path build-windows -Recurse -Filter XdrTablet.exe |
              Select-Object -First 1
          }

          if (-not $exe) {
            Write-Error "XdrTablet.exe wurde nach dem Build nicht gefunden."
            Get-ChildItem -Path build-windows -Recurse | Select-Object FullName
            exit 1
          }

          Write-Host "EXE gefunden: $($exe.FullName)"

          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Copy-Item $exe.FullName dist-windows\XdrTablet.exe

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --qmldir "$PWD\qml" `
            --compiler-runtime `
            "$PWD\dist-windows\XdrTablet.exe"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          Get-ChildItem -Path dist-windows

      - name: Inno Setup installieren
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Installer-EXE erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $tag = "${{ inputs.release_tag }}"
          $version = $tag.TrimStart("v")

          $iss = @"
          [Setup]
          AppId={{D614E436-527A-4E69-AFEA-50E18093B109}
          AppName=XdrTablet
          AppVersion=$version
          AppPublisher=fredfrei
          DefaultDirName={autopf}\XdrTablet
          DefaultGroupName=XdrTablet
          UninstallDisplayIcon={app}\XdrTablet.exe
          OutputDir=artifacts
          OutputBaseFilename=XdrTablet-Windows-x64-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Files]
          Source: "dist-windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\XdrTablet"; Filename: "{app}\XdrTablet.exe"
          Name: "{autodesktop}\XdrTablet"; Filename: "{app}\XdrTablet.exe"

          [Run]
          Filename: "{app}\XdrTablet.exe"; Description: "XdrTablet starten"; Flags: nowait postinstall skipifsilent
          "@

          $iss | Set-Content -Path XdrTablet.iss -Encoding UTF8

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe wurde nicht gefunden: $iscc"
            exit 1
          }

          & $iscc XdrTablet.iss

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path artifacts\XdrTablet-Windows-x64-Setup.exe)) {
            Write-Error "Installer wurde nicht erstellt."
            exit 1
          }

          Get-Item artifacts\XdrTablet-Windows-x64-Setup.exe

      - name: EXE als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: XdrTablet-Windows-x64
          path: artifacts/XdrTablet-Windows-x64-Setup.exe
          if-no-files-found: error

      - name: EXE an GitHub-Release anhängen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.release_tag }}"
          gh release upload "${{ inputs.release_tag }}" `
            artifacts/XdrTablet-Windows-x64-Setup.exe `
            --clobber
