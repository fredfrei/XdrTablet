name: Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: MSVC 2022 aktivieren
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Qt installieren
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtserialport
          cache: true

      - name: Compiler prüfen
        shell: pwsh
        run: |
          where.exe cl
          cl 2>&1 | Select-Object -First 5

      - name: Projekt konfigurieren
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build-windows `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release

      - name: XdrTablet bauen
        shell: pwsh
        run: |
          cmake --build build-windows --parallel

      - name: Windows-Paket erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

          Copy-Item `
            "build-windows\bin\XdrTablet.exe" `
            "package\XdrTablet.exe"

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --qmldir "$env:GITHUB_WORKSPACE\qml" `
            "$env:GITHUB_WORKSPACE\package\XdrTablet.exe"

      - name: Portable ZIP erstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          Compress-Archive `
            -Path package\* `
            -DestinationPath artifacts\XdrTablet-Windows-x86_64.zip `
            -Force

      - name: Inno Setup installieren
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Installer-Konfiguration erstellen
        shell: pwsh
        run: |
          @'
          [Setup]
          AppId=XdrTablet
          AppName=XdrTablet
          AppVersion=0.1.4
          AppPublisher=fredfrei
          DefaultDirName={autopf}\XdrTablet
          DefaultGroupName=XdrTablet
          OutputDir=artifacts
          OutputBaseFilename=XdrTablet-Windows-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\XdrTablet.exe
          WizardStyle=modern

          [Files]
          Source: "package\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Tasks]
          Name: "desktopicon"; Description: "Desktop-Verknüpfung erstellen"

          [Icons]
          Name: "{autoprograms}\XdrTablet"; Filename: "{app}\XdrTablet.exe"
          Name: "{autodesktop}\XdrTablet"; Filename: "{app}\XdrTablet.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\XdrTablet.exe"; Description: "XdrTablet starten"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer.iss

      - name: Setup-EXE bauen
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Build-Artefakte speichern
        uses: actions/upload-artifact@v4
        with:
          name: XdrTablet-Windows
          path: |
            artifacts/XdrTablet-Windows-Setup.exe
            artifacts/XdrTablet-Windows-x86_64.zip

      - name: Dateien zu Release v0.1.4 hochladen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.4 `
            artifacts/XdrTablet-Windows-Setup.exe `
            artifacts/XdrTablet-Windows-x86_64.zip `
            --clobber
